<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Transaction Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #252525;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --error: #ef4444;
      --success: #22c55e;
      --border: #333333;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(99, 60, 220, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(30, 100, 220, 0.3) 0%, transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(220, 60, 150, 0.15) 0%, transparent 50%),
        #08080c;
      background-size: 200% 200%;
      animation: gradientShift 15s ease infinite;
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
    }

    h1, h2, h3 {
      font-family: 'Poppins', sans-serif;
    }

    .register-container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .register-container h1 {
      font-size: 1.75rem;
      margin-bottom: 2px;
      text-align: center;
      font-weight: 600;
    }

    .branding-credit {
      font-size: 11px;
      color: var(--text-secondary);
      opacity: 0.55;
      text-align: center;
      margin-bottom: 24px;
    }

    .register-container .subtitle {
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
      background-color: rgba(255, 255, 255, 0.08);
    }

    .form-group .hint {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: var(--error);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
    }

    .login-link {
      text-align: center;
      margin-top: 24px;
      color: var(--text-secondary);
    }

    .login-link a {
      color: var(--accent);
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .register-container {
        padding: 28px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h1>Create Account</h1>
    <p class="branding-credit">By Nirav</p>
    <p class="subtitle">Start tracking your transactions</p>

    <div class="error-message" id="errorMessage"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autocomplete="name" placeholder="Your full name">
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Choose a username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Create a password">
        <p class="hint">Must be at least 6 characters</p>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Create Account</button>
    </form>

    <p class="login-link">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const errorMessage = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      errorMessage.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      const formData = new FormData(form);
      const data = {
        name: formData.get('name'),
        username: formData.get('username'),
        password: formData.get('password')
      };

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          window.location.href = '/';
        } else {
          errorMessage.textContent = result.error || 'Registration failed';
          errorMessage.style.display = 'block';
        }
      } catch (err) {
        errorMessage.textContent = 'An error occurred. Please try again.';
        errorMessage.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
