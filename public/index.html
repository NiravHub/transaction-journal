<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #252525;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --border: #333333;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      --gpay-color: #3b82f6;
      --phonepe-color: #7c3aed;
      --paytm-color: #06b6d4;
      --bhim-color: #f97316;
      --other-color: #6b7280;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(99, 60, 220, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(30, 100, 220, 0.3) 0%, transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(220, 60, 150, 0.15) 0%, transparent 50%),
        #08080c;
      background-size: 200% 200%;
      animation: gradientShift 15s ease infinite;
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
    }

    h1, h2, h3 {
      font-family: 'Poppins', sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 768px) {
  .header-top {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .header-right {
    width: 100%;
    justify-content: space-between;
  }
}

    .header-title {
      display: flex;
      flex-direction: column;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--text-primary);
      font-weight: 600;
    }

    .branding-credit {
      font-size: 11px;
      color: var(--text-secondary);
      opacity: 0.55;
      margin-top: 2px;
      font-weight: 400;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .username-display {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .demo-badge {
      background-color: var(--accent);
      color: white;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
    }

    .settings-wrapper {
      position: relative;
    }

    .settings-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
      transition: background-color 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .settings-btn:hover {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .settings-btn svg {
      width: 20px;
      height: 20px;
    }

    .settings-dropdown {
  display: none;
  position: absolute;
  right: 0;
  top: 100%;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  min-width: 160px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  z-index: 9999;
  margin-top: 8px;
}
@media (max-width: 768px) {
  .settings-dropdown {
    position: fixed;
    top: auto;
    right: 16px;
    left: auto;
    margin-top: 8px;
  }
}
    .settings-dropdown.show {
      display: block;
    }

    .settings-item {
      display: block;
      padding: 12px 16px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: background-color 0.2s;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .settings-item:hover {
      background-color: rgba(59, 130, 246, 0.2);
    }

    .settings-item.disabled {
      color: var(--text-secondary);
      opacity: 0.6;
    }

    .settings-divider {
      height: 1px;
      background-color: var(--glass-border);
      margin: 4px 0;
    }

    .search-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
      background-color: rgba(255, 255, 255, 0.08);
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--glass-bg-light);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
    }

    .btn-secondary:hover {
      background-color: rgba(51, 51, 51, 0.8);
    }

    .btn-danger {
      background-color: var(--error);
      color: white;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    .transactions-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transaction-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 18px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 1;
    }

    .transaction-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      border-color: var(--accent);
    }

    .transaction-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .transaction-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .transaction-amount {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--success);
    }

    .transaction-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 10px;
    }

    .transaction-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .payment-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .payment-badge.gpay { background-color: var(--gpay-color); color: white; }
    .payment-badge.phonepe { background-color: var(--phonepe-color); color: white; }
    .payment-badge.paytm { background-color: var(--paytm-color); color: white; }
    .payment-badge.bhim { background-color: var(--bhim-color); color: white; }
    .payment-badge.other { background-color: var(--other-color); color: white; }

    .payment-badge.fallback {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .has-image {
      color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state h2 {
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    /* Modal styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-overlay.active {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      animation: fadeIn 280ms ease-out;
    }

    .modal-overlay.closing {
      animation: fadeOut 200ms ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .modal {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      position: relative;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: modalSlideIn 280ms ease-out;
    }

    .modal-overlay.closing .modal {
      animation: modalSlideOut 200ms ease-out forwards;
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes modalSlideOut {
      from {
        opacity: 1;
        transform: scale(1);
      }
      to {
        opacity: 0;
        transform: scale(0.95);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-header h2 {
      font-size: 1.25rem;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    .close-btn:hover {
      color: var(--text-primary);
    }

    .modal-body {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      background-color: rgba(255, 255, 255, 0.08);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .file-input-wrapper {
      position: relative;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border: 2px dashed var(--glass-border);
      border-radius: 12px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: border-color 0.2s, color 0.2s;
    }

    .file-label:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .file-name {
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .image-preview {
      margin-top: 12px;
      max-width: 100%;
      border-radius: 8px;
      display: none;
    }

    .image-preview.show {
      display: block;
    }

    /* Detail modal */
    .detail-row {
      display: flex;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      flex: 0 0 120px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .detail-value {
      flex: 1;
      color: var(--text-primary);
    }

    .detail-image {
      width: 100%;
      border-radius: 8px;
      margin-top: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      header {
        padding: 16px;
      }

      .search-bar {
        flex-direction: column;
      }

      .transaction-meta {
        flex-direction: column;
        gap: 6px;
      }

      .detail-row {
        flex-direction: column;
        gap: 4px;
      }

      .detail-label {
        flex: none;
      }
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .toast.show {
      opacity: 1;
    }

    .toast.success {
      background-color: var(--success);
    }

    .toast.error {
      background-color: var(--error);
    }

    .btn-edit {
      background-color: var(--accent);
      color: white;
    }

    .btn-edit:hover {
      background-color: var(--accent-hover);
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile performance optimizations */
    @media (max-width: 768px) {
      .modal-overlay {
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      .modal {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div class="header-title">
          <h1>Transaction Journal</h1>
          <span class="branding-credit">By Nirav</span>
        </div>
        <div class="header-right">
          <span class="username-display" id="usernameDisplay"></span>
          <div class="settings-wrapper">
            <button class="settings-btn" id="settingsBtn" aria-label="Settings">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
            <div class="settings-dropdown" id="settingsDropdown">
              <a href="/about" class="settings-item">About</a>
              <a href="/profile" class="settings-item">Profile</a>
              <div class="settings-divider"></div>
              <button class="settings-item" id="logoutBtn">Logout</button>
            </div>
          </div>
        </div>
      </div>
      <div class="search-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="Search by title, notes, location...">
        <button class="btn btn-primary" id="addBtn">+ Add Transaction</button>
      </div>
    </header>

    <div class="transactions-list" id="transactionsList">
      <div class="loading">Loading transactions...</div>
    </div>
  </div>

  <!-- Add/Edit Transaction Modal -->
  <div class="modal-overlay" id="formModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Transaction</h2>
        <button class="close-btn" id="closeFormModal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="transactionForm">
          <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" required placeholder="Enter transaction title">
          </div>

          <div class="form-group">
            <label for="amount">Amount *</label>
            <input type="number" id="amount" required step="0.01" min="0" placeholder="0.00">
          </div>

          <div class="form-group">
            <label for="datetime">Date & Time *</label>
            <input type="datetime-local" id="datetime" required>
          </div>

          <div class="form-group">
            <label for="payment_method">Payment Method *</label>
            <select id="payment_method" required>
              <option value="">Select payment method</option>
              <option value="GPay">GPay</option>
              <option value="PhonePe">PhonePe</option>
              <option value="Paytm">Paytm</option>
              <option value="BHIM">BHIM</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group" id="other_payment_group" style="display: none;">
            <label for="other_payment_method">Payment Method Name *</label>
            <input type="text" id="other_payment_method" placeholder="Enter payment method name">
          </div>

          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="Enter location (optional)">
          </div>

          <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" placeholder="Add notes (optional)"></textarea>
          </div>

          <div class="form-group">
            <label>Image/Screenshot</label>
            <div class="file-input-wrapper">
              <input type="file" id="image" accept="image/*">
              <label for="image" class="file-label">Click to upload image (optional)</label>
            </div>
            <div class="file-name" id="fileName"></div>
            <img class="image-preview" id="imagePreview" alt="Preview">
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="cancelForm">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Transaction</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Transaction Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Transaction Details</h2>
        <button class="close-btn" id="closeDetailModal">&times;</button>
      </div>
      <div class="modal-body" id="detailBody">
        <!-- Dynamic content -->
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script>
    // DOM Elements
    const transactionsList = document.getElementById('transactionsList');
    const searchInput = document.getElementById('searchInput');
    const addBtn = document.getElementById('addBtn');
    const formModal = document.getElementById('formModal');
    const detailModal = document.getElementById('detailModal');
    const transactionForm = document.getElementById('transactionForm');
    const closeFormModal = document.getElementById('closeFormModal');
    const closeDetailModal = document.getElementById('closeDetailModal');
    const cancelForm = document.getElementById('cancelForm');
    const imageInput = document.getElementById('image');
    const imagePreview = document.getElementById('imagePreview');
    const fileName = document.getElementById('fileName');
    const datetimeInput = document.getElementById('datetime');
    const toast = document.getElementById('toast');
    const paymentMethodSelect = document.getElementById('payment_method');
    const otherPaymentGroup = document.getElementById('other_payment_group');
    const otherPaymentMethod = document.getElementById('other_payment_method');
    const modalTitle = document.getElementById('modalTitle');
    const submitBtn = document.querySelector('#transactionForm button[type="submit"]');

    let transactions = [];
    let searchTimeout = null;
    let editingTransactionId = null;
    let formHasChanges = false;
    let isSaving = false;

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      setDefaultDateTime();
      fetchTransactions();
      setupSettingsDropdown();
    });

    // Setup settings dropdown
    function setupSettingsDropdown() {
      const settingsBtn = document.getElementById('settingsBtn');
      const settingsDropdown = document.getElementById('settingsDropdown');

      settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        settingsDropdown.classList.toggle('show');
      });

      document.addEventListener('click', (e) => {
        if (!settingsDropdown.contains(e.target) && e.target !== settingsBtn) {
          settingsDropdown.classList.remove('show');
        }
      });
    }

    // Check authentication
    async function checkAuth() {
      try {
        const response = await fetch('/api/auth/me');
        if (!response.ok) {
          window.location.href = '/login';
          return;
        }
        const user = await response.json();
        const usernameDisplay = document.getElementById('usernameDisplay');
        const displayName = user.username.includes('@') ? user.username.split('@')[0] : user.username;
usernameDisplay.innerHTML = '@' + displayName;
        if (user.username === 'demo') {
          usernameDisplay.innerHTML += '<span class="demo-badge">Demo Account</span>';
        }
      } catch (error) {
        window.location.href = '/login';
      }
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login';
      } catch (error) {
        console.error('Logout failed:', error);
      }
    });

    // Set default datetime to now
    function setDefaultDateTime() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const localTime = new Date(now.getTime() - offset * 60000);
      datetimeInput.value = localTime.toISOString().slice(0, 16);
    }

    // Fetch all transactions
    async function fetchTransactions(search = '') {
      try {
        let url = '/api/transactions';
        if (search) {
          url += '?search=' + encodeURIComponent(search);
        }
        const response = await fetch(url);
        if (!response.ok) {
          if (response.status === 401) {
            window.location.href = '/login';
            return;
          }
          throw new Error('Failed to fetch');
        }
        transactions = await response.json();
        renderTransactions();
      } catch (error) {
        console.error('Error fetching transactions:', error);
        showToast('Failed to load transactions', 'error');
      }
    }

    // Render transactions list
    function renderTransactions() {
      if (transactions.length === 0) {
        transactionsList.innerHTML = `
          <div class="empty-state">
            <h2>No transactions yet</h2>
            <p>Click "Add Transaction" to get started</p>
          </div>
        `;
        return;
      }

      transactionsList.innerHTML = transactions.map(t => `
        <div class="transaction-card" data-id="${t.id}">
          <div class="transaction-header">
            <div class="transaction-title">${escapeHtml(t.title)}</div>
            <div class="transaction-amount">${formatAmount(t.amount)}</div>
          </div>
          <div class="transaction-meta">
            <span>${formatDate(t.datetime)}</span>
            <span class="payment-badge ${getPaymentBadgeClass(t.payment_method)}">${t.payment_method}</span>
            ${t.location ? `<span>${escapeHtml(t.location)}</span>` : ''}
            ${t.image_url ? '<span class="has-image">Has Image</span>' : ''}
          </div>
        </div>
      `).join('');

      // Add click handlers
      document.querySelectorAll('.transaction-card').forEach(card => {
        card.addEventListener('click', () => showTransactionDetail(card.dataset.id));
      });
    }

    // Format amount with currency
    function formatAmount(amount) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: 2
      }).format(amount);
    }

    // Format date
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-IN', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Get payment badge class
    function getPaymentBadgeClass(paymentMethod) {
      const classes = {
        'GPay': 'gpay',
        'PhonePe': 'phonepe',
        'Paytm': 'paytm',
        'BHIM': 'bhim'
      };
      return classes[paymentMethod] || 'other';
    }

    // Escape HTML
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Search functionality
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        fetchTransactions(e.target.value);
      }, 300);
    });

    // Open add modal
    addBtn.addEventListener('click', () => {
      editingTransactionId = null;
      setDefaultDateTime();
      transactionForm.reset();
      imagePreview.classList.remove('show');
      fileName.textContent = '';
      otherPaymentMethod.value = '';
      otherPaymentGroup.style.display = 'none';
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Save Transaction';
      document.getElementById('modalTitle').textContent = 'Add Transaction';
      formHasChanges = false;
      openModal(formModal);
    });

    // Payment method change handler
    paymentMethodSelect.addEventListener('change', () => {
      if (paymentMethodSelect.value === 'Other') {
        otherPaymentGroup.style.display = 'block';
        otherPaymentMethod.required = true;
      } else {
        otherPaymentGroup.style.display = 'none';
        otherPaymentMethod.required = false;
        otherPaymentMethod.value = '';
      }
      formHasChanges = true;
    });

    // Open modal helper
    function openModal(modal) {
      document.body.style.overflow = 'hidden';
      modal.classList.add('active');
    }

    // Close modals
    function closeModal(modal) {
      if (modal === formModal && formHasChanges) {
        if (!confirm('You have unsaved changes. Are you sure you want to leave?')) {
          return;
        }
      }
      modal.classList.add('closing');
      setTimeout(() => {
        modal.classList.remove('active', 'closing');
        document.body.style.overflow = '';
        formHasChanges = false;
      }, 200);
    }

    closeFormModal.addEventListener('click', () => closeModal(formModal));
    closeDetailModal.addEventListener('click', () => closeModal(detailModal));
    cancelForm.addEventListener('click', () => closeModal(formModal));

    // Close on overlay click
    formModal.addEventListener('click', (e) => {
      if (e.target === formModal) closeModal(formModal);
    });
    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) closeModal(detailModal);
    });

    // Image preview
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileName.textContent = file.name;
        const reader = new FileReader();
        reader.onload = (e) => {
          imagePreview.src = e.target.result;
          imagePreview.classList.add('show');
        };
        reader.readAsDataURL(file);
      } else {
        fileName.textContent = '';
        imagePreview.classList.remove('show');
      }
    });

    // Form submission
    transactionForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (isSaving) return;
      isSaving = true;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Saving...';

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('amount', document.getElementById('amount').value);
      formData.append('datetime', document.getElementById('datetime').value);
      formData.append('payment_method', document.getElementById('payment_method').value);
      formData.append('location', document.getElementById('location').value);
      formData.append('notes', document.getElementById('notes').value);

      if (paymentMethodSelect.value === 'Other') {
        formData.append('other_payment_method', otherPaymentMethod.value);
      }

      const imageFile = imageInput.files[0];
      if (imageFile) {
        formData.append('image', imageFile);
      }

      try {
        let response;
        if (editingTransactionId) {
          response = await fetch('/api/transactions/' + editingTransactionId, {
            method: 'PUT',
            body: formData
          });
        } else {
          response = await fetch('/api/transactions', {
            method: 'POST',
            body: formData
          });
        }

        if (response.ok) {
          formHasChanges = false;
          closeModal(formModal);
          fetchTransactions(searchInput.value);
          showToast('Transaction saved successfully', 'success');
        } else if (response.status === 401) {
          window.location.href = '/login';
        } else if (response.status === 409) {
          showToast('Duplicate transaction detected', 'error');
        } else {
          const error = await response.json();
          showToast(error.error || 'Failed to save transaction', 'error');
        }
      } catch (error) {
        console.error('Error saving transaction:', error);
        showToast('Failed to save transaction', 'error');
      } finally {
        isSaving = false;
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Save Transaction';
      }
    });

    // Track form changes for unsaved warning
    transactionForm.addEventListener('input', () => {
      formHasChanges = true;
    });

    // Show transaction detail
    async function showTransactionDetail(id) {
      try {
        const response = await fetch('/api/transactions/' + id);
        if (response.status === 401) {
          window.location.href = '/login';
          return;
        }
        const transaction = await response.json();

        if (!transaction || transaction.error) {
          showToast('Transaction not found', 'error');
          return;
        }

        const detailBody = document.getElementById('detailBody');
        detailBody.innerHTML = `
          <div class="detail-row">
            <div class="detail-label">Title</div>
            <div class="detail-value">${escapeHtml(transaction.title)}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Amount</div>
            <div class="detail-value" style="color: var(--success); font-weight: 700; font-size: 1.2rem;">${formatAmount(transaction.amount)}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Date & Time</div>
            <div class="detail-value">${formatDate(transaction.datetime)}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Payment</div>
            <div class="detail-value"><span class="payment-badge ${getPaymentBadgeClass(transaction.payment_method)}">${transaction.payment_method}</span></div>
          </div>
          ${transaction.location ? `
          <div class="detail-row">
            <div class="detail-label">Location</div>
            <div class="detail-value">${escapeHtml(transaction.location)}</div>
          </div>
          ` : ''}
          ${transaction.notes ? `
          <div class="detail-row">
            <div class="detail-label">Notes</div>
            <div class="detail-value">${escapeHtml(transaction.notes)}</div>
          </div>
          ` : ''}
          ${transaction.image_url ? `
          <div class="detail-row">
            <div class="detail-label">Image</div>
            <div class="detail-value">
              <img class="detail-image" src="${transaction.image_url}" alt="Transaction image">
            </div>
          </div>
          ` : ''}
          <div class="modal-actions">
            <button class="btn btn-edit" id="editTransaction" data-id="${transaction.id}">Edit</button>
            <button class="btn btn-danger" id="deleteTransaction" data-id="${transaction.id}">Delete</button>
            <button class="btn btn-secondary" onclick="closeModal(detailModal)">Close</button>
          </div>
        `;

        // Add edit handler
        document.getElementById('editTransaction').addEventListener('click', () => {
          closeModal(detailModal);
          openEditModal(transaction);
        });

        // Add delete handler
        document.getElementById('deleteTransaction').addEventListener('click', () => deleteTransaction(transaction.id));

        openModal(detailModal);
      } catch (error) {
        console.error('Error loading transaction:', error);
        showToast('Failed to load transaction details', 'error');
      }
    }

    // Open edit modal with pre-filled data
    function openEditModal(transaction) {
      editingTransactionId = transaction.id;

      document.getElementById('title').value = transaction.title;
      document.getElementById('amount').value = transaction.amount;
      document.getElementById('datetime').value = transaction.datetime;
      document.getElementById('location').value = transaction.location || '';
      document.getElementById('notes').value = transaction.notes || '';

      // Handle payment method selection
      const standardMethods = ['GPay', 'PhonePe', 'Paytm', 'BHIM'];
      if (standardMethods.includes(transaction.payment_method)) {
        paymentMethodSelect.value = transaction.payment_method;
        otherPaymentGroup.style.display = 'none';
        otherPaymentMethod.required = false;
        otherPaymentMethod.value = '';
      } else {
        paymentMethodSelect.value = 'Other';
        otherPaymentGroup.style.display = 'block';
        otherPaymentMethod.required = true;
        otherPaymentMethod.value = transaction.payment_method;
      }

      // Show existing image if any
      if (transaction.image_url) {
        imagePreview.src = transaction.image_url;
        imagePreview.classList.add('show');
        fileName.textContent = 'Current image (upload new to replace)';
      } else {
        imagePreview.classList.remove('show');
        fileName.textContent = '';
      }

      document.getElementById('modalTitle').textContent = 'Edit Transaction';
      submitBtn.innerHTML = 'Save Transaction';
      submitBtn.disabled = false;
      formHasChanges = false;
      openModal(formModal);
    }

    // Delete transaction
    async function deleteTransaction(id) {
      if (!confirm('Are you sure you want to delete this transaction?')) {
        return;
      }

      try {
        const response = await fetch('/api/transactions/' + id, {
          method: 'DELETE'
        });

        if (response.ok) {
          closeModal(detailModal);
          fetchTransactions(searchInput.value);
          showToast('Transaction deleted successfully', 'success');
        } else if (response.status === 401) {
          window.location.href = '/login';
        } else {
          showToast('Failed to delete transaction', 'error');
        }
      } catch (error) {
        console.error('Error deleting transaction:', error);
        showToast('Failed to delete transaction', 'error');
      }
    }

    // Toast notification
    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className = 'toast ' + type + ' show';
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal(formModal);
        closeModal(detailModal);
      }
    });

    // Unsaved changes warning on page close
    window.addEventListener('beforeunload', (e) => {
      if (formHasChanges && formModal.classList.contains('active')) {
        e.preventDefault();
        e.returnValue = 'You have unsaved changes. Are you sure you want to leave?';
        return e.returnValue;
      }
    });
  </script>
</body>
</html>
