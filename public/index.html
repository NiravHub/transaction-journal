<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Journal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #252525;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --border: #333333;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      background-color: var(--bg-secondary);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--text-primary);
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .username-display {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background-color 0.2s;
      font-size: 0.9rem;
    }

    .nav-link:hover {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .search-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .btn-danger {
      background-color: var(--error);
      color: white;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    .transactions-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transaction-card {
      background-color: var(--bg-secondary);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow);
    }

    .transaction-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    .transaction-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .transaction-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .transaction-amount {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--success);
    }

    .transaction-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .transaction-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .payment-badge {
      background-color: var(--bg-tertiary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .has-image {
      color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state h2 {
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    /* Modal styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-overlay.active {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .modal {
      background-color: var(--bg-secondary);
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 1.25rem;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    .close-btn:hover {
      color: var(--text-primary);
    }

    .modal-body {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 1rem;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .file-input-wrapper {
      position: relative;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border: 2px dashed var(--border);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: border-color 0.2s, color 0.2s;
    }

    .file-label:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .file-name {
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .image-preview {
      margin-top: 12px;
      max-width: 100%;
      border-radius: 8px;
      display: none;
    }

    .image-preview.show {
      display: block;
    }

    /* Detail modal */
    .detail-row {
      display: flex;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      flex: 0 0 120px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .detail-value {
      flex: 1;
      color: var(--text-primary);
    }

    .detail-image {
      width: 100%;
      border-radius: 8px;
      margin-top: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      header {
        padding: 16px;
      }

      .search-bar {
        flex-direction: column;
      }

      .transaction-meta {
        flex-direction: column;
        gap: 6px;
      }

      .detail-row {
        flex-direction: column;
        gap: 4px;
      }

      .detail-label {
        flex: none;
      }
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .toast.show {
      opacity: 1;
    }

    .toast.success {
      background-color: var(--success);
    }

    .toast.error {
      background-color: var(--error);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <h1>Transaction Journal</h1>
        <div class="header-nav">
          <span class="username-display" id="usernameDisplay"></span>
          <a href="/profile" class="nav-link">Profile</a>
          <a href="#" class="nav-link" id="logoutBtn">Logout</a>
        </div>
      </div>
      <div class="search-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="Search by title, notes, location...">
        <button class="btn btn-primary" id="addBtn">+ Add Transaction</button>
      </div>
    </header>

    <div class="transactions-list" id="transactionsList">
      <div class="loading">Loading transactions...</div>
    </div>
  </div>

  <!-- Add/Edit Transaction Modal -->
  <div class="modal-overlay" id="formModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Transaction</h2>
        <button class="close-btn" id="closeFormModal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="transactionForm">
          <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" required placeholder="Enter transaction title">
          </div>

          <div class="form-group">
            <label for="amount">Amount *</label>
            <input type="number" id="amount" required step="0.01" min="0" placeholder="0.00">
          </div>

          <div class="form-group">
            <label for="datetime">Date & Time *</label>
            <input type="datetime-local" id="datetime" required>
          </div>

          <div class="form-group">
            <label for="payment_method">Payment Method *</label>
            <select id="payment_method" required>
              <option value="">Select payment method</option>
              <option value="UPI">UPI</option>
              <option value="Cash">Cash</option>
              <option value="Card">Card</option>
              <option value="NetBanking">NetBanking</option>
            </select>
          </div>

          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="Enter location (optional)">
          </div>

          <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" placeholder="Add notes (optional)"></textarea>
          </div>

          <div class="form-group">
            <label>Image/Screenshot</label>
            <div class="file-input-wrapper">
              <input type="file" id="image" accept="image/*">
              <label for="image" class="file-label">Click to upload image (optional)</label>
            </div>
            <div class="file-name" id="fileName"></div>
            <img class="image-preview" id="imagePreview" alt="Preview">
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="cancelForm">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Transaction</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Transaction Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Transaction Details</h2>
        <button class="close-btn" id="closeDetailModal">&times;</button>
      </div>
      <div class="modal-body" id="detailBody">
        <!-- Dynamic content -->
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script>
    // DOM Elements
    const transactionsList = document.getElementById('transactionsList');
    const searchInput = document.getElementById('searchInput');
    const addBtn = document.getElementById('addBtn');
    const formModal = document.getElementById('formModal');
    const detailModal = document.getElementById('detailModal');
    const transactionForm = document.getElementById('transactionForm');
    const closeFormModal = document.getElementById('closeFormModal');
    const closeDetailModal = document.getElementById('closeDetailModal');
    const cancelForm = document.getElementById('cancelForm');
    const imageInput = document.getElementById('image');
    const imagePreview = document.getElementById('imagePreview');
    const fileName = document.getElementById('fileName');
    const datetimeInput = document.getElementById('datetime');
    const toast = document.getElementById('toast');

    let transactions = [];
    let searchTimeout = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      setDefaultDateTime();
      fetchTransactions();
    });

    // Check authentication
    async function checkAuth() {
      try {
        const response = await fetch('/api/auth/me');
        if (!response.ok) {
          window.location.href = '/login';
          return;
        }
        const user = await response.json();
        document.getElementById('usernameDisplay').textContent = '@' + user.username;
      } catch (error) {
        window.location.href = '/login';
      }
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login';
      } catch (error) {
        console.error('Logout failed:', error);
      }
    });

    // Set default datetime to now
    function setDefaultDateTime() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const localTime = new Date(now.getTime() - offset * 60000);
      datetimeInput.value = localTime.toISOString().slice(0, 16);
    }

    // Fetch all transactions
    async function fetchTransactions(search = '') {
      try {
        let url = '/api/transactions';
        if (search) {
          url += '?search=' + encodeURIComponent(search);
        }
        const response = await fetch(url);
        if (!response.ok) {
          if (response.status === 401) {
            window.location.href = '/login';
            return;
          }
          throw new Error('Failed to fetch');
        }
        transactions = await response.json();
        renderTransactions();
      } catch (error) {
        console.error('Error fetching transactions:', error);
        showToast('Failed to load transactions', 'error');
      }
    }

    // Render transactions list
    function renderTransactions() {
      if (transactions.length === 0) {
        transactionsList.innerHTML = `
          <div class="empty-state">
            <h2>No transactions yet</h2>
            <p>Click "Add Transaction" to get started</p>
          </div>
        `;
        return;
      }

      transactionsList.innerHTML = transactions.map(t => `
        <div class="transaction-card" data-id="${t.id}">
          <div class="transaction-header">
            <div class="transaction-title">${escapeHtml(t.title)}</div>
            <div class="transaction-amount">${formatAmount(t.amount)}</div>
          </div>
          <div class="transaction-meta">
            <span>${formatDate(t.datetime)}</span>
            <span class="payment-badge">${t.payment_method}</span>
            ${t.location ? `<span>${escapeHtml(t.location)}</span>` : ''}
            ${t.image_url ? '<span class="has-image">Has Image</span>' : ''}
          </div>
        </div>
      `).join('');

      // Add click handlers
      document.querySelectorAll('.transaction-card').forEach(card => {
        card.addEventListener('click', () => showTransactionDetail(card.dataset.id));
      });
    }

    // Format amount with currency
    function formatAmount(amount) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: 2
      }).format(amount);
    }

    // Format date
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-IN', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Escape HTML
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Search functionality
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        fetchTransactions(e.target.value);
      }, 300);
    });

    // Open add modal
    addBtn.addEventListener('click', () => {
      setDefaultDateTime();
      transactionForm.reset();
      imagePreview.classList.remove('show');
      fileName.textContent = '';
      document.getElementById('modalTitle').textContent = 'Add Transaction';
      formModal.classList.add('active');
    });

    // Close modals
    function closeModal(modal) {
      modal.classList.remove('active');
    }

    closeFormModal.addEventListener('click', () => closeModal(formModal));
    closeDetailModal.addEventListener('click', () => closeModal(detailModal));
    cancelForm.addEventListener('click', () => closeModal(formModal));

    // Close on overlay click
    formModal.addEventListener('click', (e) => {
      if (e.target === formModal) closeModal(formModal);
    });
    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) closeModal(detailModal);
    });

    // Image preview
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileName.textContent = file.name;
        const reader = new FileReader();
        reader.onload = (e) => {
          imagePreview.src = e.target.result;
          imagePreview.classList.add('show');
        };
        reader.readAsDataURL(file);
      } else {
        fileName.textContent = '';
        imagePreview.classList.remove('show');
      }
    });

    // Form submission
    transactionForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('amount', document.getElementById('amount').value);
      formData.append('datetime', document.getElementById('datetime').value);
      formData.append('payment_method', document.getElementById('payment_method').value);
      formData.append('location', document.getElementById('location').value);
      formData.append('notes', document.getElementById('notes').value);

      const imageFile = imageInput.files[0];
      if (imageFile) {
        formData.append('image', imageFile);
      }

      try {
        const response = await fetch('/api/transactions', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          closeModal(formModal);
          fetchTransactions(searchInput.value);
          showToast('Transaction saved successfully', 'success');
        } else if (response.status === 401) {
          window.location.href = '/login';
        } else {
          const error = await response.json();
          showToast(error.error || 'Failed to save transaction', 'error');
        }
      } catch (error) {
        console.error('Error saving transaction:', error);
        showToast('Failed to save transaction', 'error');
      }
    });

    // Show transaction detail
    async function showTransactionDetail(id) {
      try {
        const response = await fetch('/api/transactions/' + id);
        if (response.status === 401) {
          window.location.href = '/login';
          return;
        }
        const transaction = await response.json();

        if (!transaction || transaction.error) {
          showToast('Transaction not found', 'error');
          return;
        }

        const detailBody = document.getElementById('detailBody');
        detailBody.innerHTML = `
          <div class="detail-row">
            <div class="detail-label">Title</div>
            <div class="detail-value">${escapeHtml(transaction.title)}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Amount</div>
            <div class="detail-value" style="color: var(--success); font-weight: 700; font-size: 1.2rem;">${formatAmount(transaction.amount)}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Date & Time</div>
            <div class="detail-value">${formatDate(transaction.datetime)}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Payment</div>
            <div class="detail-value"><span class="payment-badge">${transaction.payment_method}</span></div>
          </div>
          ${transaction.location ? `
          <div class="detail-row">
            <div class="detail-label">Location</div>
            <div class="detail-value">${escapeHtml(transaction.location)}</div>
          </div>
          ` : ''}
          ${transaction.notes ? `
          <div class="detail-row">
            <div class="detail-label">Notes</div>
            <div class="detail-value">${escapeHtml(transaction.notes)}</div>
          </div>
          ` : ''}
          ${transaction.image_url ? `
          <div class="detail-row">
            <div class="detail-label">Image</div>
            <div class="detail-value">
              <img class="detail-image" src="${transaction.image_url}" alt="Transaction image">
            </div>
          </div>
          ` : ''}
          <div class="modal-actions">
            <button class="btn btn-danger" id="deleteTransaction" data-id="${transaction.id}">Delete</button>
            <button class="btn btn-secondary" onclick="closeModal(detailModal)">Close</button>
          </div>
        `;

        // Add delete handler
        document.getElementById('deleteTransaction').addEventListener('click', () => deleteTransaction(transaction.id));

        detailModal.classList.add('active');
      } catch (error) {
        console.error('Error loading transaction:', error);
        showToast('Failed to load transaction details', 'error');
      }
    }

    // Delete transaction
    async function deleteTransaction(id) {
      if (!confirm('Are you sure you want to delete this transaction?')) {
        return;
      }

      try {
        const response = await fetch('/api/transactions/' + id, {
          method: 'DELETE'
        });

        if (response.ok) {
          closeModal(detailModal);
          fetchTransactions(searchInput.value);
          showToast('Transaction deleted successfully', 'success');
        } else if (response.status === 401) {
          window.location.href = '/login';
        } else {
          showToast('Failed to delete transaction', 'error');
        }
      } catch (error) {
        console.error('Error deleting transaction:', error);
        showToast('Failed to delete transaction', 'error');
      }
    }

    // Toast notification
    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className = 'toast ' + type + ' show';
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal(formModal);
        closeModal(detailModal);
      }
    });
  </script>
</body>
</html>
