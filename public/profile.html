<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Transaction Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #252525;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --border: #333333;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(99, 60, 220, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(30, 100, 220, 0.3) 0%, transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(220, 60, 150, 0.15) 0%, transparent 50%),
        #08080c;
      background-size: 200% 200%;
      animation: gradientShift 15s ease infinite;
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
    }

    h1, h2, h3 {
      font-family: 'Poppins', sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      gap: 12px;
    }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 10px;
      transition: background-color 0.2s;
    }

    .nav-link:hover {
      background-color: rgba(59, 130, 246, 0.2);
      color: var(--text-primary);
    }

    .demo-badge {
      background-color: var(--accent);
      color: white;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 8px;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--glass-border);
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .profile-info h2 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .profile-info .username {
      color: var(--text-secondary);
    }

    .profile-field {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--glass-border);
    }

    .profile-field:last-child {
      border-bottom: none;
    }

    .field-label {
      color: var(--text-secondary);
    }

    .field-value {
      font-weight: 500;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 24px;
    }

    .stat-card {
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .stat-card.success .stat-value {
      color: var(--success);
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>My Profile</h1>
      <div class="nav-links">
        <a href="/" class="nav-link">Transactions</a>
        <a href="#" class="nav-link" id="logoutBtn">Logout</a>
      </div>
    </header>

    <div id="profileContent">
      <div class="loading">Loading profile...</div>
    </div>
  </div>

  <script>
    async function loadProfile() {
      const content = document.getElementById('profileContent');

      try {
        const response = await fetch('/api/auth/profile');

        if (!response.ok) {
          if (response.status === 401) {
            window.location.href = '/login';
            return;
          }
          throw new Error('Failed to load profile');
        }

        const data = await response.json();
        const { user, stats } = data;

        const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

        content.innerHTML = `
          <div class="profile-card">
            <div class="profile-header">
              <div class="avatar">${initials}</div>
              <div class="profile-info">
                <h2>${escapeHtml(user.name)}</h2>
                <div class="username">@${escapeHtml(user.username)}${user.username === 'demo' ? '<span class="demo-badge">Demo Account</span>' : ''}</div>
              </div>
            </div>

            <div class="profile-field">
              <span class="field-label">Name</span>
              <span class="field-value">${escapeHtml(user.name)}</span>
            </div>

            <div class="profile-field">
              <span class="field-label">Username</span>
              <span class="field-value">${escapeHtml(user.username)}</span>
            </div>

            <div class="profile-field">
              <span class="field-label">Member Since</span>
              <span class="field-value">${formatDate(user.created_at)}</span>
            </div>

            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-value">${stats.transactionCount}</div>
                <div class="stat-label">Transactions</div>
              </div>
              <div class="stat-card success">
                <div class="stat-value">₹${stats.totalSpent.toFixed(2)}</div>
                <div class="stat-label">Total Spent</div>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        content.innerHTML = `<div class="loading">Error loading profile. <a href="/">Go back</a></div>`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login';
      } catch (err) {
        console.error('Logout failed:', err);
      }
    });

    loadProfile();
  </script>
</body>
</html>
